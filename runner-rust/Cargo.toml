[package]
name = "b2t-runner"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Measures binary-to-text encodings against each other on one corpus, in one process."
license = "MPL-2.0"
publish = false

[lib]
name = "b2t_runner"
path = "src/lib.rs"

[[bin]]
name = "b2t-runner"
path = "src/main.rs"

[dependencies]
# The codecs under test, built from source so that every number comes out of
# the same compiler at the same optimisation level. `codecs/` is populated by
# scripts/link-codecs.sh and is not checked in: which revision of each codec is
# measured is a property of the run, not of this repository.
base91z = { path = "../codecs/base91z/rust", features = ["zstd"] }
base85n = { path = "../codecs/base85n/rust" }
base94max = { path = "../codecs/base94max/rust" }

zstd = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
