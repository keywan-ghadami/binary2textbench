# The central run: every codec at whatever revision was asked for.
#
# A pull request here changes the runner, the corpus or the profiles, so it has
# to measure itself -- a corpus change moves every number in the report, and
# that should be visible before it merges rather than afterwards.
name: Benchmark

on:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base91z_ref:
        description: "base91z ref to measure"
        required: false
        default: main
      base85n_ref:
        description: "base85n ref to measure"
        required: false
        default: main
      base94max_ref:
        description: "base94max ref to measure"
        required: false
        default: main
      groups:
        description: "core,short,synthetic — add silesia for the long run"
        required: false
        default: core,short,synthetic
      rounds:
        description: "timing rounds"
        required: false
        default: "7"

permissions:
  contents: read

# Never two benchmark jobs on one runner pool at once: they would be measuring
# each other. Queue rather than cancel, so a scheduled run is not lost to a push.
concurrency:
  group: bench
  cancel-in-progress: false

jobs:
  bench:
    name: Six encodings
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: binary2textbench

      - uses: actions/checkout@v4
        with:
          repository: keywan-ghadami/base91z
          ref: ${{ inputs.base91z_ref || 'main' }}
          path: base91z
      - uses: actions/checkout@v4
        with:
          repository: keywan-ghadami/base85n
          ref: ${{ inputs.base85n_ref || 'main' }}
          path: base85n
      - uses: actions/checkout@v4
        with:
          repository: keywan-ghadami/base94max
          ref: ${{ inputs.base94max_ref || 'main' }}
          path: base94max

      - uses: ./binary2textbench
        with:
          base91z-path: ${{ github.workspace }}/base91z
          base85n-path: ${{ github.workspace }}/base85n
          base94max-path: ${{ github.workspace }}/base94max
          groups: ${{ inputs.groups || 'core,short,synthetic' }}
          rounds: ${{ inputs.rounds || '7' }}
          title: Six encodings on one corpus

      - uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: b2t-site/
          retention-days: 90
